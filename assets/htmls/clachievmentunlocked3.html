<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Achievement Unlocked 3</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #player-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    ruffle-player {
      width: 100% !important;
      height: 100% !important;
      display: block !important;
    }
  </style>
  <script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
      autoplay: "on",
      unmuteOverlay: "hidden",
      letterbox: "on",
      warnOnUnsupportedContent: false,
      contextMenu: "on",
      showSwfDownload: false,
      upgradeToHttps: false,
      maxExecutionDuration: 30,
      splashScreen: false
    };
  </script>
  <script src="../ruffle/ruffle.js"></script>
</head>
<body>
  <div id="player-container"></div>
  <script>
    (function() {
      const SWF_URL = "../swfs/achievement-unlocked-3.swf";
      let attempts = 0;
      
      function start() {
        try {
          const ruffle = window.RufflePlayer && window.RufflePlayer.newest ? window.RufflePlayer.newest() : null;
          if (!ruffle) {
            attempts++;
            if (attempts < 100) {
              setTimeout(start, 50);
            }
            return;
          }
          const container = document.getElementById("player-container");
          container.innerHTML = "";
          const player = ruffle.createPlayer();
          player.style.width = "100%";
          player.style.height = "100%";
          container.appendChild(player);
          player.load({
            url: SWF_URL,
            allowScriptAccess: true
          });
          
          window.addEventListener("click", () => {
            try { player.focus(); } catch (e) {}
          });
          window.addEventListener("keydown", () => {
            try { player.focus(); } catch (e) {}
          });
        } catch (e) {
          console.error("Error starting Flash player:", e);
        }
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", start);
      } else {
        start();
      }
    })();
  </script>
</body>
</html>
